# Runs on every change (pull request) to main, including the ones the case
# editor opens. Publishing is blocked unless this passes.
name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # pdftotext, used to read each decision's text
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install
        run: npm ci

      # Case files valid, types, lint, and the number-and-quote check on the
      # cases this change touches (scripts/check-changed-cases.mjs).
      - name: Check
        run: npm run check -- --base origin/${{ github.base_ref }}

      # Links inside case text: swansonreed.com pages must answer (a 404 or 410 blocks;
      # a slow or refusing site is only a notice).
      - name: Links
        run: node scripts/check-links.mjs --base origin/${{ github.base_ref }}

      - name: Build
        run: npm run build

      # Every indexable page has one canonical link that is its own address; every redirect
      # target exists and no old address is still built.
      - name: Canonical links and redirects
        run: |
          node scripts/check-canonicals.mjs out
          node scripts/build-redirects.mjs --check out

      # The rendered HTML says full addresses (https://rdtaxcases.com/...) for every internal link,
      # canonical and structured-data URL; the content itself stays path-based.
      - name: Absolute addresses in the HTML
        run: node scripts/check-absolute-links.mjs out
